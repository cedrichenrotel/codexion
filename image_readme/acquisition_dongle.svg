<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagramme de flux montrant les etapes de verrouillage du mutex, d'enregistrement dans le tableau de priorite avec remontee en tete si la cle est la plus petite, de verification des 4 conditions, de mise en veille via cond_timedwait en cas d'echec, et d'attribution du dongle suivie du deverrouillage.</desc>

