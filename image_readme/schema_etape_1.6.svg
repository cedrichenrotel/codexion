<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sur les 4 coders disposes en cercle avec leurs dongles, Coder 0 a verrouille ses deux dongles voisins (traits pleins) et peut donc s'executer. Les autres connexions restent en attente (traits pointilles).</desc>

