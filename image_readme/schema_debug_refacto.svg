<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Le coder verrouille son mutex, affiche son statut avec l'instant et son identifiant, simule la duree avec usleep, change de statut puis deverrouille. Cette meme structure est appliquee deux fois : une fois pour debugging, une fois pour refactoring, avec des valeurs differentes.</desc>

